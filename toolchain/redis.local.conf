# =============================================================================
#  Redis local development config (template)
#  Placeholders __DATA_DIR__ and __PASSWORD__ are substituted by redis-start.ps1
#  Persistence model (important - Redis is the PRIMARY datastore for this site):
#     appendonly yes  -> every write is journaled, at most 1s of data lost on crash
#     save 60 10000   -> extra RDB snapshots
#     noeviction      -> never silently drop keys holding site content
# =============================================================================
port 6379
bind 127.0.0.1
protected-mode yes

# ---- storage ----
dir "__DATA_DIR__"
dbfilename "dump.rdb"
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ---- snapshot policy ----
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum yes

# ---- security ----
requirepass "__PASSWORD__"
maxmemory 256mb
maxmemory-policy noeviction
# ---- dangerous commands: disabled or renamed to unguessable strings ----
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command SHUTDOWN ""
rename-command DEBUG ""
rename-command CONFIG "RENAME_CFG_8f31d0a2c7"
rename-command KEYS   "RENAME_KEYS_1c94e5b6"

# ---- misc ----
loglevel notice
timeout 0
tcp-keepalive 300
hash-max-ziplist-entries 512
list-max-ziplist-size -2
activerehashing yes
