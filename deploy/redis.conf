# =============================================================================
#  Redis 生产配置 —— Redis 是本站主存储，持久化和禁用高危命令都不能省
#  挂载位置见 docker-compose.yml： ./deploy/redis.conf:/usr/local/etc/redis/redis.conf
#  注意：requirepass 由容器启动时的 CONFIG SET 或本文件的字面值提供，
#        生产建议保持字面值 + .env 强密码 + 6379 不对外开放。
# =============================================================================
bind 127.0.0.1 -::1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ---------------------------- 持久化 ----------------------------
# AOF 为主：崩溃最多丢 1 秒写入；RDB 作为额外快照
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data
rdbcompression yes
rdbchecksum yes
stop-writes-on-bgsave-error yes

# ---------------------------- 容量 ----------------------------
maxmemory 512mb
# 内容 key 绝不能被淘汰，否则整站内容消失
maxmemory-policy noeviction

# ---------------------------- 安全 ----------------------------
# 注意：这里【不要】写 requirepass。
# docker-compose.yml 用 `redis-server redis.conf --requirepass ${REDIS_PASSWORD}`
# 注入密码，密码就只存在于 .env 一份；写死在这里会和 .env 不一致，
# 导致后端认证失败、健康检查永远 unhealthy、api 永远起不来。

# 高危命令：禁用或改名为不可猜字符串（防止爆破者清库）
rename-command FLUSHALL     ""
rename-command FLUSHDB      ""
rename-command SHUTDOWN     ""
rename-command DEBUG        ""
rename-command SAVE         ""
rename-command BGSAVE       "BG_SAVE_PRIVATE_9a2e"
rename-command CONFIG       "CONFIG_PRIVATE_4c81"
rename-command KEYS         "KEYS_PRIVATE_7d30"
rename-command SCRIPT       ""
rename-command EVAL         ""
rename-command REPLICAOF    ""
rename-command SLAVEOF      ""

# ---------------------------- 杂项 ----------------------------
loglevel notice
databases 4
slowlog-log-slower-than 10000
slowlog-max-len 128
hash-max-ziplist-entries 512
list-max-ziplist-size -2
activerehashing yes
