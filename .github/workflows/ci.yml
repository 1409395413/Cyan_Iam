name: build-check

# 目的：保证推到 GitHub 的 main 分支"克隆下来就能 docker compose up"。
# 只做编译校验，不部署。
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Java 17 build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Package
        run: mvn -B -q clean package -DskipTests
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-server
          path: server/target/*.jar
          retention-days: 7

  frontend:
    name: Vue build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: web/dist
          retention-days: 7
